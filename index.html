<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11110F" />
  <meta name="description" content="Personal life tracker for classes, gym, and events." />
  <title>llc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311110F'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Times New Roman,Times,serif' font-style='italic' font-size='16' fill='%23EDE8DE'%3Ellc%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">llc</span>
      </div>
      <nav class="nav" aria-label="Main">
        <button class="nav-btn is-active" data-page="calendar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 9h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Calendar
        </button>
        <button class="nav-btn" data-page="agenda" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h13M8 12h13M8 17h13M4 7h.01M4 12h.01M4 17h.01" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Agenda
        </button>
        <button class="nav-btn" data-page="classes" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6a1 1 0 0 1 1-1h6v14H5a1 1 0 0 1-1-1zm10-9h6l-1.5 9H14V10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 8v.01M8 11v.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Classes
        </button>
        <button class="nav-btn" data-page="gym" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8v8M17 8v8M4 10v4M20 10v4M7 12h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Gym
        </button>
        <button class="nav-btn" data-page="tasks" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 12l2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tasks
        </button>
        <button class="nav-btn" data-page="settings" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M18 6l-1.6 1.6M7.6 16.4L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          Settings
        </button>
      </nav>
      <div class="sidebar-cats">
        <div class="sidebar-label">Categories</div>
        <div id="category-filters"></div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <h1 class="topbar-title">llc</h1>
        <div class="topbar-period" id="period-label"></div>
        <div class="topbar-spacer"></div>
        <div class="view-switch" id="view-switch" hidden>
          <button type="button" data-mode="month">Month</button>
          <button type="button" data-mode="week">Week</button>
          <button type="button" data-mode="day">Day</button>
        </div>
        <div class="date-nav" id="date-nav" hidden>
          <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="text-btn" id="today-btn" type="button">Today</button>
          <button class="icon-btn" id="next-btn" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12.5A6.5 6.5 0 1 1 11.5 6 5 5 0 0 0 17 12.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
        <button class="primary-btn add-btn" id="add-btn" type="button">Add</button>
      </header>

      <main class="main">
        <section class="view" id="view-calendar">
          <div class="calendar-layout">
            <div class="calendar-board" id="calendar-board"></div>
            <aside class="today-panel" id="today-panel" aria-label="Today and upcoming"></aside>
          </div>
        </section>
        <section class="view" id="view-agenda" hidden></section>
        <section class="view" id="view-classes" hidden></section>
        <section class="view" id="view-gym" hidden></section>
        <section class="view" id="view-tasks" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>
  </div>

  <dialog class="modal" id="modal">
    <div class="modal-card">
      <header class="modal-head">
        <h2 id="modal-title">Details</h2>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-foot" id="modal-footer"></footer>
    </div>
  </dialog>

  <dialog class="modal onboarding" id="onboarding">
    <div class="modal-card onboarding-card">
      <p class="eyebrow">Welcome</p>
      <h2>llc</h2>
      <p class="lead">Your Spring 2027 Broward College schedule is already on the calendar (times are approximate and easy to edit). Track gym, events, and tasks here too. Everything stays on this device unless you export a backup.</p>
      <div class="onboard-actions">
        <button class="primary-btn" id="onboard-classes" type="button">Review class schedule</button>
        <button class="secondary-btn" id="onboard-gym" type="button">Set up gym split</button>
        <button class="text-btn" id="onboard-skip" type="button">I'll explore first</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="file-json" accept="application/json,.json" hidden />
  <input type="file" id="file-ics" accept="text/calendar,.ics" hidden />

  <noscript>
    <p class="noscript">llc needs JavaScript turned on to run.</p>
  </noscript>

  <script src="js/store.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
